[package]
name = "iroh-services-proto"
version = "0.1.0"
edition = "2024"
description = "Raw wire types for iroh-services protocol implementations"
license = "MIT OR Apache-2.0"
authors = ["n0 team"]
repository = "https://github.com/n0-computer/iroh-services"
rust-version = "1.91"

[dependencies]
derive_more = { version = "2.0.1", features = ["display", "from"] }
irpc = { version = "0.17", default-features = false, features = ["derive", "rpc", "stream", "spans"] }
iroh = { version = "1.0.0", default-features = false, features = ["unstable-net-report"] }
iroh-metrics = { version = "1.0.0", default-features = false }
n0-error = "1.0.0"
rcan = "0.4"
serde = { version = "1.0.217", features = ["derive"] }
strum = { version = "0.28", features = ["derive"] }
tracing = "0.1.41"
uuid = { version = "1.17", features = ["serde"] }

[dev-dependencies]
postcard = { version = "1.1.3", features = ["use-std"] }

[package.metadata.cargo_check_external_types]
allowed_external_types = [
    # This crate depends on irpc and rcan types, which are not at 1.0,
    # so major bumps in these crates need a major bump of iroh-services-proto too.
    "rcan::*",
    "irpc::*",
    # We use iroh's NetReport type on the wire. Note that this type
    # is under iroh's unstable-net-report feature, which means it can break at any time.
    # If it does break, we need to release a new major version of iroh-services-proto
    # and disallow older iroh versions.
    "iroh::net_report::report::Report",
    # non 1.0 crates:
    # We are using strum to parse caps from strings, which brings an error type.
    "strum::ParseError",
    # 1.0 crates without unstable features
    "n0_error::*",
    "iroh_base::*",
    "iroh_metrics::*",
    "serde_core::*",
    "tracing::span::Span",
    "uuid::Uuid",
]
